<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>問答｜年齡與憂鬱、焦慮、壓力的關係</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site">
  <div class="site-in">
    <a class="brand" href="index.html">DASS 研究專題</a>
    <nav aria-label="主要導覽"><a href="index.html">首頁</a><a href="results.html">研究結果</a><a href="ask.html" aria-current="page">問答</a><a href="about.html">關於研究</a></nav>
    <button type="button" id="themeBtn" aria-pressed="false">夜間模式</button>
  </div>
</header>
<main>
<h1>問答</h1>
<section class="card soon">
  <div class="big">即將推出</div>
  <p>此頁面尚在準備中，敬請期待。</p>
</section>

<section class="card">
  <button type="button" class="tb" id="pingBtn" style="--c:var(--accent)">測試連線</button>
  <pre id="pingOut" aria-live="polite" style="margin:12px 0 0;white-space:pre-wrap;word-break:break-all;font:inherit;font-size:.9rem;color:var(--mute)"></pre>
</section>
</main>
<footer class="site-foot">
  <div class="site-in">
    <span>組別：第 ＿ 組</span>
    <span>組員：（請填入組員姓名）</span>
  </div>
</footer>
<script>
(function(){
  var t='';try{t=localStorage.getItem('dass-theme')||''}catch(e){}
  if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  var b=document.getElementById('themeBtn');
  function ap(x){t=x;document.documentElement.dataset.theme=x;b.setAttribute('aria-pressed',x==='dark')}
  b.addEventListener('click',function(){var x=t==='dark'?'light':'dark';try{localStorage.setItem('dass-theme',x)}catch(e){}ap(x)});
  ap(t);
})();
</script>
<script>
(function(){
  var API='https://dass-42.d84134012.workers.dev/';
  var btn=document.getElementById('pingBtn'),out=document.getElementById('pingOut');
  btn.addEventListener('click',function(){
    btn.disabled=true;
    out.textContent='連線中…';
    var ctrl=new AbortController();
    var timer=setTimeout(function(){ctrl.abort()},10000);
    fetch(API,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'test'}),
      signal:ctrl.signal
    }).then(function(r){
      return r.text().then(function(t){
        if(r.ok){out.textContent='成功（狀態碼 '+r.status+'）：'+t;return}
        var msg=t;
        try{var j=JSON.parse(t);if(j&&j.error)msg=j.error}catch(e){}
        out.textContent='失敗（狀態碼 '+r.status+'）：'+msg;
      });
    }).catch(function(e){
      out.textContent=e.name==='AbortError'
        ?'失敗：等待超過 10 秒沒有回應。'
        :'失敗：無法連線到後端（'+e.message+'）。請檢查網路，或後端是否已部署。';
    }).finally(function(){
      clearTimeout(timer);
      btn.disabled=false;
    });
  });
})();
</script>
</body>
</html>
