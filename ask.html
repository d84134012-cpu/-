<script>
(function(){
  var t='';try{t=localStorage.getItem('dass-theme')||''}catch(e){}
  if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  var b=document.getElementById('themeBtn');
  function ap(x){t=x;document.documentElement.dataset.theme=x;b.setAttribute('aria-pressed',x==='dark')}
  b.addEventListener('click',function(){var x=t==='dark'?'light':'dark';try{localStorage.setItem('dass-theme',x)}catch(e){}ap(x)});
  ap(t);
})();
</script>
